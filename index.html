<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>파스텔 호핑 - 아바타</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    @font-face {
      font-family: 'Cafe24 Ssurround';
      font-weight: 700;
      font-style: normal;
      font-display: swap;
      src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2105_2@1.0/Cafe24Ssurround.woff') format('woff');
    }

    /* ================================================================
       Base — artboard 2594 × 4611 (Figma page-pastel-hopping)
       ================================================================ */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #ffffff;
      font-family: 'Noto Sans KR', sans-serif;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      position: relative;
      width: 100%;
      max-width: 2594px;
      margin: 0 auto;
    }

    .bg-image {
      width: 100%;
      height: auto;
      display: block;
    }

    .el {
      position: absolute;
      pointer-events: none;
    }
    .el img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* ================================================================
       Animations
       ================================================================ */
    .anim {
      opacity: 0;
      will-change: opacity, transform;
    }

    .anim.fade-up     { transform: translateY(50px); }
    .anim.slide-left   { transform: translateX(-80px); }
    .anim.slide-right  { transform: translateX(80px); }
    .anim.pop-in       { transform: scale(0.8); }
    .anim.zoom-in      { transform: scale(0.92); }

    .anim.visible {
      opacity: 1;
      transform: none;
      transition: opacity 0.9s cubic-bezier(.22,1,.36,1),
                  transform 0.9s cubic-bezier(.22,1,.36,1);
    }

    .d1  { transition-delay: 0.08s !important; }
    .d2  { transition-delay: 0.16s !important; }
    .d3  { transition-delay: 0.24s !important; }
    .d4  { transition-delay: 0.32s !important; }
    .d5  { transition-delay: 0.40s !important; }
    .d6  { transition-delay: 0.48s !important; }
    .d7  { transition-delay: 0.56s !important; }
    .d8  { transition-delay: 0.64s !important; }
    .d9  { transition-delay: 0.72s !important; }
    .d10 { transition-delay: 0.80s !important; }

    /* ================================================================
       Hero — section-hero (536, 160) 1477×1079 → global / 2594 / 4611
       ================================================================ */
    .hero-char-lithia-2p  { left: 55.940%; top: 4.012%;  width: 16.389%; }
    .hero-char-noah-2p    { left: 29.415%; top: 3.471%;  width: 13.646%; }

    .hero-logo {
      left: 36.241%; top: 4.880%; width: 26.716%;
      overflow: hidden;
      aspect-ratio: 693 / 661;
    }
    .hero-logo img {
      position: absolute;
      width: 116.45%;
      max-width: none;
      left: -9.47%;
      top: -53.61%;
    }

    .hero-char-aisha-1p   { left: 54.587%; top: 5.791%;  width: 23.015%; }
    .hero-char-lu-1p      { left: 20.663%; top: 6.224%;  width: 13.957%; }
    .hero-char-add-1p     { left: 24.441%; top: 9.521%;  width: 23.593%; }
    .hero-char-elsword-1p { left: 38.551%; top: 9.521%;  width: 33.887%; }
    .hero-event-period    { left: 36.241%; top: 19.540%; width: 26.349%; }

    /* ================================================================
       Blue Soda — panel (561, 969) + nested offsets
       ================================================================ */
    .blue-soda-panel { left: 21.608%; top: 21.016%; width: 55.975%; }

    .bs-raven-1p  { left: 30.780%; top: 26.806%; width: 11.989%; }
    .bs-lu-1p     { left: 43.601%; top: 27.067%; width: 5.358%; }
    .bs-aisha-1p  { left: 48.130%; top: 27.109%; width: 9.370%; }
    .bs-laby-1p   { left: 57.517%; top: 27.022%; width: 6.862%; }

    .bs-ain-1p      { left: 35.120%; top: 33.268%; width: 5.436%; }
    .bs-add-1p      { left: 41.365%; top: 33.268%; width: 9.059%; }
    .bs-elesis-1p   { left: 49.268%; top: 33.247%; width: 8.558%; }
    .bs-elsword-1p  { left: 53.545%; top: 33.268%; width: 13.030%; }

    /* ================================================================
       Black Sorbet — panel (562, 1763)
       ================================================================ */
    .black-sorbet-panel { left: 21.666%; top: 38.236%; width: 55.900%; }

    .bsb-eve-2p    { left: 33.809%; top: 44.285%; width: 9.638%; }
    .bsb-chung-2p  { left: 43.428%; top: 44.612%; width: 8.366%; }
    .bsb-noah-2p   { left: 51.793%; top: 44.025%; width: 7.285%; }
    .bsb-ciel-2p   { left: 59.077%; top: 43.635%; width: 8.019%; }

    .bsb-rena-2p    { left: 35.698%; top: 51.140%; width: 6.285%; }
    .bsb-rose-2p    { left: 43.062%; top: 51.053%; width: 6.052%; }
    .bsb-lithia-2p  { left: 49.382%; top: 50.988%; width: 8.906%; }
    .bsb-ara-2p     { left: 55.319%; top: 50.380%; width: 11.949%; }

    /* ================================================================
       Bonus — panel (585, 2587); items grid from Figma 16:2–16:8
       ================================================================ */
    .bonus-panel { left: 22.552%; top: 56.106%; width: 56.052%; }

    .bonus-elesis-hair  { left: 40.170%; top: 63.739%; width: 6.862%; }
    .bonus-elesis-acc   { left: 51.812%; top: 63.739%; width: 7.979%; }
    .bonus-elsword-hair { left: 39.823%; top: 69.790%; width: 9.406%; }
    .bonus-elsword-acc  { left: 50.077%; top: 69.790%; width: 12.259%; }

    .bonus-label {
      position: absolute;
      font-family: 'Cafe24 Ssurround', 'Noto Sans KR', sans-serif;
      font-weight: 700;
      font-size: clamp(9px, 0.655vw, 17px);
      line-height: 1.15;
      color: #502d6c;
      text-align: center;
      white-space: nowrap;
      transform: translateX(-50%);
      pointer-events: none;
    }
    .bonus-label.anim.visible { transform: translateX(-50%) translateY(0); }
    .bonus-label.anim.fade-up { transform: translateX(-50%) translateY(30px); }

    .bl-1 { left: 43.601%; top: 68.520%; }
    .bl-2 { left: 55.800%; top: 68.520%; }
    .bl-3 { left: 44.527%; top: 75.380%; }
    .bl-4 { left: 56.207%; top: 75.380%; }

    /* ================================================================
       Notice — node 1:47: Cafe24 20px / 28px, #6e3976, centered x ≈ 50.56%
       ================================================================ */
    .notice-text {
      position: absolute;
      left: 50.557%;
      top: 79.202%;
      transform: translateX(-50%);
      font-family: 'Cafe24 Ssurround', 'Noto Sans KR', sans-serif;
      font-weight: 700;
      font-size: 20px;
      line-height: 0;
      color: #6e3976;
      text-align: center;
      white-space: nowrap;
      pointer-events: none;
    }
    .notice-text.anim.visible  { transform: translateX(-50%) translateY(0); }
    .notice-text.anim.fade-up  { transform: translateX(-50%) translateY(30px); }
    .notice-text p {
      margin: 0;
      line-height: 28px;
      white-space: pre;
    }
  </style>
</head>
<body>
  <div class="page">
    <img class="bg-image" src="images/bg-image.png" alt="배경">

    <!-- Hero (z-order: lithia → noah → logo → aisha → lu → add → elsword → period) -->
    <div class="el hero-char-lithia-2p anim slide-right" data-hero>
      <img src="images/lithia-2p.png" alt="리티아 2P">
    </div>

    <div class="el hero-char-noah-2p anim slide-left d1" data-hero>
      <img src="images/noah-2p.png" alt="노아 2P">
    </div>

    <div class="el hero-logo anim zoom-in d3" data-hero>
      <img src="images/hero-logo.png" alt="파스텔 호핑 로고">
    </div>

    <div class="el hero-char-aisha-1p anim slide-right d2" data-hero>
      <img src="images/aisha-1p.png" alt="아이샤 1P">
    </div>

    <div class="el hero-char-lu-1p anim slide-left d2" data-hero>
      <img src="images/lu-1p.png" alt="루 1P">
    </div>

    <div class="el hero-char-add-1p anim slide-left d4" data-hero>
      <img src="images/add-1p.png" alt="애드 1P">
    </div>

    <div class="el hero-char-elsword-1p anim slide-right d4" data-hero>
      <img src="images/elsword-1p.png" alt="엘소드 1P">
    </div>

    <div class="el hero-event-period anim fade-up d6" data-hero>
      <img src="images/event-period.png" alt="이벤트 기간">
    </div>

    <!-- Blue Soda -->
    <div class="el blue-soda-panel anim zoom-in" data-section="blue-soda">
      <img src="images/blue-soda-panel.png" alt="파스텔 호핑 - 블루 소다">
    </div>

    <div class="el bs-raven-1p anim pop-in d1" data-section="blue-soda">
      <img src="images/raven-1p.png" alt="레이븐 1P">
    </div>
    <div class="el bs-lu-1p anim pop-in d2" data-section="blue-soda">
      <img src="images/lu-1p.png" alt="루 1P">
    </div>
    <div class="el bs-aisha-1p anim pop-in d3" data-section="blue-soda">
      <img src="images/aisha-1p.png" alt="아이샤 1P">
    </div>
    <div class="el bs-laby-1p anim pop-in d4" data-section="blue-soda">
      <img src="images/laby-1p.png" alt="라비 1P">
    </div>

    <div class="el bs-ain-1p anim pop-in d5" data-section="blue-soda">
      <img src="images/ain-1p.png" alt="아인 1P">
    </div>
    <div class="el bs-add-1p anim pop-in d6" data-section="blue-soda">
      <img src="images/add-1p.png" alt="애드 1P">
    </div>
    <div class="el bs-elesis-1p anim pop-in d7" data-section="blue-soda">
      <img src="images/elesis-1p.png" alt="엘리시스 1P">
    </div>
    <div class="el bs-elsword-1p anim pop-in d8" data-section="blue-soda">
      <img src="images/elsword-1p.png" alt="엘소드 1P">
    </div>

    <!-- Black Sorbet -->
    <div class="el black-sorbet-panel anim zoom-in" data-section="black-sorbet">
      <img src="images/black-sorbet-panel.png" alt="파스텔 호핑 - 블랙 소르베">
    </div>

    <div class="el bsb-eve-2p anim pop-in d1" data-section="black-sorbet">
      <img src="images/eve-2p.png" alt="이브 2P">
    </div>
    <div class="el bsb-chung-2p anim pop-in d2" data-section="black-sorbet">
      <img src="images/chung-2p.png" alt="청 2P">
    </div>
    <div class="el bsb-noah-2p anim pop-in d3" data-section="black-sorbet">
      <img src="images/noah-2p.png" alt="노아 2P">
    </div>
    <div class="el bsb-ciel-2p anim pop-in d4" data-section="black-sorbet">
      <img src="images/ciel-2p.png" alt="시엘 2P">
    </div>

    <div class="el bsb-rena-2p anim pop-in d5" data-section="black-sorbet">
      <img src="images/rena-2p.png" alt="레나 2P">
    </div>
    <div class="el bsb-rose-2p anim pop-in d6" data-section="black-sorbet">
      <img src="images/rose-2p.png" alt="로제 2P">
    </div>
    <div class="el bsb-lithia-2p anim pop-in d7" data-section="black-sorbet">
      <img src="images/lithia-2p.png" alt="리티아 2P">
    </div>
    <div class="el bsb-ara-2p anim pop-in d8" data-section="black-sorbet">
      <img src="images/ara-2p.png" alt="아라 2P">
    </div>

    <!-- Bonus -->
    <div class="el bonus-panel anim zoom-in" data-section="bonus">
      <img src="images/bonus-panel.png" alt="프리미엄 패키지 BONUS">
    </div>

    <div class="el bonus-elesis-hair anim fade-up d2" data-section="bonus">
      <img src="images/bonus-elesis-1p-hair.png" alt="엘리시스 1P 헤어">
    </div>
    <div class="el bonus-elesis-acc anim fade-up d3" data-section="bonus">
      <img src="images/bonus-elesis-1p-acc.png" alt="엘리시스 1P 악세서리">
    </div>
    <div class="el bonus-elsword-hair anim fade-up d4" data-section="bonus">
      <img src="images/bonus-elsword-2p-hair.png" alt="엘소드 2P 헤어">
    </div>
    <div class="el bonus-elsword-acc anim fade-up d5" data-section="bonus">
      <img src="images/bonus-elsword-2p-acc.png" alt="엘소드 2P 악세서리">
    </div>

    <p class="bonus-label bl-1 anim fade-up d3" data-section="bonus">파스텔 호핑 버니 비니 - 블루 소다</p>
    <p class="bonus-label bl-2 anim fade-up d4" data-section="bonus">파스텔 호핑 버니 비니 - 블루 소다</p>
    <p class="bonus-label bl-3 anim fade-up d5" data-section="bonus">파스텔 호핑 버니 비니 - 블루 소다</p>
    <p class="bonus-label bl-4 anim fade-up d6" data-section="bonus">파스텔 호핑 버니 비니 - 블루 소다</p>

    <div class="notice-text anim fade-up" data-section="notice">
      <p>- ‘파스텔 호핑 패키지’ 구매 시 무기/헤어/상의/하의/장갑/신발 파츠를 획득할 수 있으며 각 파츠는 개별로도 구매 가능합니다.<br>
 - ‘파스텔 호핑 프리미엄 패키지’ 구매 시 ‘파스텔 호핑 패키지’ 구성품과 더불어 파스텔 호핑 버니 비니(헤어),</p>
      <p>버니 백(액세서리 상의)을 추가로 획득할 수 있습니다.</p>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {

      setTimeout(() => {
        document.querySelectorAll('[data-hero]').forEach(el => {
          el.classList.add('visible');
        });
      }, 200);

      const sectionMap = {};
      document.querySelectorAll('[data-section]').forEach(el => {
        const key = el.dataset.section;
        if (!sectionMap[key]) sectionMap[key] = [];
        sectionMap[key].push(el);
      });

      const sectionObserver = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (!entry.isIntersecting) return;

          const key = entry.target.dataset.section;
          const elements = sectionMap[key];
          if (elements) {
            elements.forEach(el => el.classList.add('visible'));
          }
          sectionObserver.unobserve(entry.target);
        });
      }, {
        threshold: 0.15,
        rootMargin: '0px 0px -60px 0px'
      });

      Object.values(sectionMap).forEach(elements => {
        if (elements[0]) sectionObserver.observe(elements[0]);
      });
    });
  </script>
</body>
</html>
